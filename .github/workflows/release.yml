name: Mac and Windows preview release
run-name: Preview ${{ inputs.version || github.ref_name }}
on:
  push:
    tags: ['v*-preview.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'New preview tag, e.g. v0.1.3-preview.1 (run from main)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: preview-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}
jobs:
  test:
    if: github.repository == 'YuShenLiu06/codex-reset-monitor' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release source and version
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v\d+\.\d+\.\d+-preview\.\d+",os.environ["RELEASE_TAG"]), "Preview tag required"'
          test -s "docs/release-notes/$RELEASE_TAG.md"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Dispatch releases from main only'; exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Offline tests
        run: python3 -m unittest discover -s tests -v
  build:
    needs: test
    runs-on: macos-15 # Standard M1 arm64 runner; free in this public repository.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
          architecture: arm64
      - name: Check architecture and test native protocol
        run: |
          test "$(uname -m)" = arm64
          python3 -m unittest discover -s tests -p test_macos_gui.py -v
      - name: Install hash-locked official build dependencies
        env:
          PIP_NO_CACHE_DIR: '1'
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r macos/build-requirements.txt
          python3 scripts/release_dependencies.py "$RUNNER_TEMP/release-deps"
      - name: Build self-contained Mac preview with reviewed public App fields
        run: |
          bundle_version="${RELEASE_TAG#v}"
          bundle_version="${bundle_version%%-preview.*}"
          "$RUNNER_TEMP/build-venv/bin/python" scripts/build_macos.py \
            --output runtime/release-assets --version "$bundle_version" \
            --gh "$RUNNER_TEMP/release-deps/gh/bin/gh" \
            --python-license "$RUNNER_TEMP/release-deps/Python-LICENSE.txt" \
            --public-config macos/public-app.json
      - name: Scan ZIP, extract, verify signatures and smoke frozen worker offline
        run: |
          python3 scripts/verify_macos_release.py runtime/release-assets "$GITHUB_SHA" --public-config macos/public-app.json
          python3 - <<'PY'
          import os,pathlib,plistlib
          info=plistlib.loads(pathlib.Path('runtime/release-assets/Codex 提醒设置.app/Contents/Info.plist').read_bytes())
          assert info['CFBundleShortVersionString']==os.environ['RELEASE_TAG'].removeprefix('v').split('-preview.')[0]
          assert info.get('CodexBuildLabel','')==''
          PY
          "runtime/release-assets/Codex 提醒设置.app/Contents/Resources/worker/reset-worker" --tls-check > runtime/release-assets/PUBLIC-TLS-CHECK.json
          python3 scripts/verify_deployment_pair.py "runtime/release-assets/Codex 提醒设置.app/Contents/Resources/worker/reset-worker" "$GITHUB_SHA" runtime/release-assets/DEPLOYMENT-PAIR-CHECKS.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-preview
          path: |
            runtime/release-assets/codex-reset-installer-macos-arm64-preview.zip
            runtime/release-assets/SHA256SUMS
            runtime/release-assets/BUILD-CHECKS.json
            runtime/release-assets/PUBLIC-TLS-CHECK.json
            runtime/release-assets/DEPLOYMENT-PAIR-CHECKS.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  windows:
    needs: test
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: read
  publish:
    needs: [build, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-preview
          path: runtime/release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-preview
          path: runtime/windows-release
      - name: Verify common source and publish both platforms as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_preview.py runtime/release-assets runtime/windows-release

  verify-published-windows:
    needs: publish
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-preview
          path: runtime/downloaded-release
      - name: Download the published EXE and verify its released identity
        shell: python
        run: |
          import hashlib,json,os,pathlib,urllib.request
          folder=pathlib.Path('runtime/downloaded-release')
          base='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/'+os.environ['RELEASE_TAG']+'/'
          for name in ('codex-reset-installer-windows-x64-preview.exe','WINDOWS-SHA256SUMS','WINDOWS-BUILD-CHECKS.json','RELEASE-MANIFEST.json'):
              with urllib.request.urlopen(base+name,timeout=60) as source:
                  (folder/name).write_bytes(source.read())
          report=json.loads((folder/'WINDOWS-BUILD-CHECKS.json').read_text())
          manifest=json.loads((folder/'RELEASE-MANIFEST.json').read_text())
          exe=folder/'codex-reset-installer-windows-x64-preview.exe'
          checksum=hashlib.sha256(exe.read_bytes()).hexdigest()
          assert report['source_commit']==manifest['source_commit']==os.environ['GITHUB_SHA']
          assert report['archive_sha256']==manifest['platforms']['windows-x64']['sha256']==checksum
          (folder/'PUBLISHED-IDENTITY.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'tag':os.environ['RELEASE_TAG'],'sha256':checksum}))
      - name: Run downloaded final EXE through the same actual artifact acceptance
        run: python scripts/verify_windows_release.py runtime/downloaded-release "$env:GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: published-windows-acceptance
          path: |
            runtime/downloaded-release/PUBLISHED-IDENTITY.json
            runtime/downloaded-release/WINDOWS-BUILD-CHECKS.json
            runtime/downloaded-release/windows-evidence/
          if-no-files-found: error
          retention-days: 7

  verify-published-macos:
    needs: publish
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
          architecture: arm64
      - name: Download and verify the published Mac archive
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,plistlib,urllib.request,zipfile
          folder=pathlib.Path('runtime/published-macos');folder.mkdir(parents=True)
          base='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/'+os.environ['RELEASE_TAG']+'/'
          for name in ('codex-reset-installer-macos-arm64-preview.zip','MACOS-SHA256SUMS','RELEASE-MANIFEST.json'):
              with urllib.request.urlopen(base+name,timeout=60) as source:
                  (folder/('SHA256SUMS' if name=='MACOS-SHA256SUMS' else name)).write_bytes(source.read())
          manifest=json.loads((folder/'RELEASE-MANIFEST.json').read_text())
          checksum=hashlib.sha256((folder/'codex-reset-installer-macos-arm64-preview.zip').read_bytes()).hexdigest()
          assert manifest['source_commit']==manifest['deployment_manifest_commit']==os.environ['GITHUB_SHA']
          assert manifest['platforms']['macos-arm64']['sha256']==checksum
          with zipfile.ZipFile(folder/'codex-reset-installer-macos-arm64-preview.zip') as archive:
              info=plistlib.loads(archive.read('Codex 提醒设置.app/Contents/Info.plist'))
          assert info['CFBundleShortVersionString']==os.environ['RELEASE_TAG'].removeprefix('v').split('-preview.')[0]
          assert info.get('CodexBuildLabel','')==''
          (folder/'PUBLISHED-IDENTITY.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'tag':os.environ['RELEASE_TAG'],'sha256':checksum}))
          PY
          python3 scripts/verify_macos_release.py runtime/published-macos "$GITHUB_SHA" --public-config macos/public-app.json
          ditto -x -k runtime/published-macos/codex-reset-installer-macos-arm64-preview.zip runtime/published-macos/unpacked
          "runtime/published-macos/unpacked/Codex 提醒设置.app/Contents/Resources/worker/reset-worker" --tls-check > runtime/published-macos/PUBLIC-TLS-CHECK.json
          python3 scripts/verify_deployment_pair.py "runtime/published-macos/unpacked/Codex 提醒设置.app/Contents/Resources/worker/reset-worker" "$GITHUB_SHA" runtime/published-macos/DEPLOYMENT-PAIR-CHECKS.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: published-macos-acceptance
          path: |
            runtime/published-macos/PUBLISHED-IDENTITY.json
            runtime/published-macos/BUILD-CHECKS.json
            runtime/published-macos/PUBLIC-TLS-CHECK.json
            runtime/published-macos/DEPLOYMENT-PAIR-CHECKS.json
          if-no-files-found: error
          retention-days: 7

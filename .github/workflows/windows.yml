name: Windows preview
run-name: Windows x64 preview · ${{ github.sha }}
on:
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
      - 'installer/**'
      - 'scripts/*windows*'
      - 'tests/test_windows.py'
      - '.github/workflows/windows.yml'
      - 'scripts/release_assets.py'
      - 'tests/test_shared_release.py'
      - '.gitattributes'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'YuShenLiu06/codex-reset-monitor' && github.event.repository.private == false
    runs-on: windows-2025 # Standard hosted Windows x64; no larger/paid runner.
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Windows offline core and protocol checks
        run: |
          python -m unittest discover -s tests -p test_windows.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_installer.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_gui_worker.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch and verify fixed official Windows build inputs
        run: python scripts/windows_dependencies.py "$env:RUNNER_TEMP/windows-deps"
      - name: Install hash-locked worker build dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r windows/build-requirements.txt
      - name: Build native x64 single EXE preview
        run: python scripts/build_windows.py --deps "$env:RUNNER_TEMP/windows-deps" --output runtime/windows-release
      - name: Run final EXE, clean paths, cache recovery, comparison and offline UI-worker E2E
        run: python scripts/verify_windows_release.py runtime/windows-release "$env:GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-x64-preview
          path: runtime/windows-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
